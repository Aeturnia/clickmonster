<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16120f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ClickMonster</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="top" aria-label="Your hero"></header>
    <main id="main"></main>
    <aside id="chatbar" aria-label="Chat"></aside>
    <div id="dock" role="region" aria-label="Actions"></div>
    <nav id="nav" aria-label="Screens"></nav>
    <div id="side"><section id="summary"></section><section id="minimap"></section><aside id="chatpanel" aria-labelledby="chatpanel-h"></aside></div>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-body"></div></dialog>
  <dialog id="chat" aria-label="Chat"><div id="chat-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sr-status" class="sr-only" aria-live="polite"></div>
  <div id="alerts" aria-label="Problems"></div>
  <noscript>ClickMonster needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
