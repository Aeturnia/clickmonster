# Static site — no build step. Netlify serves the public/ folder as-is.
[build]
  publish = "public"
  command = "echo 'No build needed'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Always fetch fresh game code so updates show up right away.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Staff console at /admin. The page is public HTML, but every action is checked by the server.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Vendored libraries (public/vendor/README.md): the version is in the path, so a file never
# changes once published.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The public static pages (Monstra Regna scope, MR-B2, 4.4): plain HTML files, public/<name>.html,
# served at /<name> by a 200 rewrite, with the news pages' headers: no script, nothing loaded from
# another host, not framed. Each is a single file, not a directory with an index.html: Netlify
# answers a directory's address without its trailing slash with a 301 to the slash form before any
# rewrite applies, which the first version did (docs/monstra-regna-b2-report.md, section 7).
# The slash forms (/guide/) need no rule: Netlify itself answers them with a 301 to the slashless
# address, before any rewrite, which then answers 200 (the address contract, report section 7.5).
[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/leaderboard"
  to = "/leaderboard.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[headers]]
  for = "/guide*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/leaderboard*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/contact*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

